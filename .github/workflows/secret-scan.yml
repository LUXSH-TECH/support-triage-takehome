name: secret-scan

# Scans every pull request (including candidate submissions) and pushes to main
# for committed secrets, using the same allowlist as the local pre-commit hook
# (.gitleaks.toml). Runs the gitleaks CLI directly so no paid Action licence is
# required for this org-owned repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose
